<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}DHRA{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 1rem 1.25rem 4rem;
         line-height: 1.5; background: Canvas; color: CanvasText; }
  nav { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; padding-bottom: .75rem; border-bottom: 1px solid #8884; }
  nav a { text-decoration: none; color: inherit; opacity: .75; }
  nav a:hover { opacity: 1; text-decoration: underline; }
  h1 { font-size: 1.3rem; }
  .corpus-version { font-size: .8rem; opacity: .6; font-family: monospace; }
  .evidence { border: 1px solid #8884; border-radius: 6px; padding: .75rem 1rem; margin: .75rem 0; }
  .evidence blockquote { margin: .4rem 0; font-size: 1.05rem; }
  .evidence .meta { font-size: .8rem; opacity: .65; display: flex; gap: 1rem; flex-wrap: wrap; }
  .narrative { border: 2px dashed #c908; border-radius: 6px; padding: .75rem 1rem; margin-top: 1.25rem; background: #ffdf0008; }
  .narrative .badge { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: #a60; font-weight: 600; }
  .absence-note { border-left: 3px solid #888; padding: .5rem 1rem; opacity: .85; font-style: italic; }
  .status-code { font-family: monospace; font-weight: 700; border: 1px solid currentColor; border-radius: 4px;
                 padding: 0 .35em; cursor: help; }
  .warning { border-left: 3px solid #c40; padding: .4rem .8rem; margin: .4rem 0; background: #c4000008; }
  table { border-collapse: collapse; width: 100%; margin: .5rem 0; }
  th, td { text-align: left; padding: .3rem .6rem; border-bottom: 1px solid #8883; font-size: .92rem; }
  form.inline { display: inline; }
  button, input[type=submit] { cursor: pointer; }
  textarea, input[type=text] { font-family: monospace; width: 100%; box-sizing: border-box; }
  .muted { opacity: .6; font-size: .85rem; }
  code { font-size: .9em; }
</style>
</head>
<body>
<nav>
  <a href="/">Search</a>
  <a href="/ingest">Add item</a>
  <a href="/claims">Claims</a>
  <a href="/aggregate">Aggregate</a>
  <a href="/exclusions">Exclusions</a>
  <a href="/trace">Trace</a>
  <span class="corpus-version">corpus {{ corpus_version if corpus_version is defined else '' }}</span>
</nav>
{% block content %}{% endblock %}
</body>
</html>
