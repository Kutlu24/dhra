{% extends "base.html" %}
{% block title %}Assess a claim -- DHRA{% endblock %}
{% block content %}
<h1>{{ t('claim_new.title') }}</h1>
<p class="muted">{{ t('claim_new.description') | safe }}</p>
<form method="post" action="/claims/assess">
  <p><label>{{ t('claim_new.claim_id_label') }}<br><input type="text" name="claim_id" required></label></p>
  <p><label>{{ t('claim_new.claim_text_label') }}<br><input type="text" name="claim_text" required></label></p>
  <p><label>{{ t('claim_new.actor_label') }}<br><input type="text" name="actor" value="researcher" required></label></p>

  <p><label>{{ t('claim_new.supporting_label') }}<br>
    <textarea name="supporting" rows="3">{% if item_id %}{{ item_id }},{{ rep_id }},{{ start }},{{ end }}{% endif %}</textarea>
  </label></p>
  <p><label>{{ t('claim_new.contradicting_label') }}<br><textarea name="contradicting" rows="2"></textarea></label></p>
  <p><label>{{ t('claim_new.negating_label') }}<br><textarea name="negating" rows="2"></textarea></label></p>

  <p><label><input type="checkbox" name="run_independence" value="true">
    {{ t('claim_new.independence_label') | safe }}</label></p>

  <button type="submit">{{ t('claim_new.submit') }}</button>
</form>
{% endblock %}
