services:
  - type: web
    name: dhra
    runtime: docker
    plan: free
    envVars:
      # No longer a value here on purpose -- DHRA moved from "temporary demo"
      # to a real public deployment (2026-09-18). Leave this unset/empty in
      # the Render dashboard for no banner, or set your own (e.g. a beta
      # notice) directly there -- sync: false so a fresh blueprint apply
      # never silently re-adds the old "temporary" wording.
      - key: DHRA_DEMO_BANNER
        sync: false
      # GLM (Z.AI free-tier API key, obtained directly by the researcher --
      # not self-hosted) -- not required for the demo to run: chat/research/
      # teaching all degrade gracefully to evidence-only without them. Set
      # these once the key exists.
      - key: DHRA_GLM_BASE_URL
        sync: false
      - key: DHRA_GLM_API_KEY
        sync: false
      - key: DHRA_GLM_MODEL
        sync: false
