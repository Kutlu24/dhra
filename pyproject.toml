[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhra"
version = "0.0.1"
description = "Digital Humanities Research Agent -- local-first, provenance-first corpus/evidence system"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "convertdate>=2.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
desktop-build = ["pyinstaller>=6.0"]

[project.scripts]
dhra = "dhra.cli:main"
dhra-desktop = "dhra.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
