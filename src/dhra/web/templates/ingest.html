{% extends "base.html" %}
{% block title %}Add item -- DHRA{% endblock %}
{% block content %}
<h1>{{ t('ingest.title') }}</h1>
<p class="muted">{{ t('ingest.description') | safe }}</p>
<form method="post" action="/ingest" enctype="multipart/form-data">
  <p><label>{{ t('ingest.source_id_label') }}<br><input type="text" name="source_id" value="manual_upload" required></label></p>
  <p><label>{{ t('ingest.access_basis_label') }}<br>
    <select name="access_basis">
      <option value="public_domain">public_domain</option>
      <option value="licensed">licensed</option>
      <option value="tdm_exception">tdm_exception</option>
      <option value="permission">permission</option>
      <option value="unknown">unknown</option>
    </select>
  </label></p>
  <p><label>{{ t('ingest.licence_label') }}<br><input type="text" name="licence_id"></label></p>
  <p><label>{{ t('ingest.reference_label') }}<br><input type="text" name="original_reference"></label></p>
  <p><label>{{ t('ingest.paste_label') }}<br><textarea name="text" rows="6" placeholder="{{ t('ingest.paste_placeholder') }}"></textarea></label></p>
  <p><label>{{ t('ingest.file_label') }}<br><input type="file" name="file"></label></p>
  <button type="submit">{{ t('ingest.submit') }}</button>
</form>
{% endblock %}
