[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhra"
version = "0.0.1"
description = "Digital Humanities Research Assistant -- local-first, provenance-first corpus/evidence system"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "convertdate>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.0",
    # dhra.interpreter (Simultaneous Interpreter, mounted at /interpreter -
    # see web/app.py's build_app) - a live speech tool, unrelated to the
    # rest of DHRA's own dependencies above.
    "pydantic-settings>=2.2",
    "openai>=1.50",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.40", "pytest-playwright>=0.5"]
desktop-build = ["pyinstaller>=6.0"]

[project.scripts]
dhra = "dhra.cli:main"
dhra-desktop = "dhra.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "e2e: browser-based acceptance tests (Playwright/axe-core). Slow, and launches its own server process -- run explicitly with `pytest -m e2e`, excluded from the default run.",
]
addopts = "-m 'not e2e'"
