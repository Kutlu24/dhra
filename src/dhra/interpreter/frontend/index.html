<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simultaneous Interpreter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette matches DHRA's own tokens (src/dhra/web/static/css/dhra.css) -
     this page used to be its own separately-branded deployment (bright
     blue accent, cool blue-gray background), which looked jarring once it
     became a page inside DHRA rather than its own site. DHRA self-hosts
     IBM Plex Sans via @font-face on its own stylesheet, which this page
     (served standalone, no link to DHRA's static.css) doesn't load - a
     Google Fonts copy gets the same typeface without depending on DHRA's
     asset pipeline. */
  :root {
    --accent: #1f5f5a; --accent-dark: #163f3c; --accent-soft: #eaf1ef;
    --bg: #fafaf8; --surface: #fff; --border: #e2e0d8; --text: #1c1b17; --muted: #6b6a62;
    --warn: #93610a; --warn-bg: #f8f0e0; --warn-border: #e0c48f;
    --danger: #a13b2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans SC", sans-serif;
    background: var(--bg); color: var(--text);
  }
  .dhra-header {
    display: none; align-items: center; gap: 8px; padding: 10px 24px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .dhra-header a { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; }
  .dhra-header a:hover { color: var(--accent); }
  /* A roomier, less bare-bones frame than the original 640px column - more
     breathing room on desktop without hurting the phone layout, since the
     mic bar / cards still stack full-width below ~700px anyway. */
  .wrap { max-width: 960px; margin: 0 auto; padding: 36px 20px 96px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand-icon {
    flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  h1 { font-size: 30px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 16px; margin: 0 0 28px; max-width: 64ch; line-height: 1.55; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04), 0 8px 24px -12px rgba(16, 24, 40, 0.08); }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  select, input[type=text] { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; margin-bottom: 14px; background: #fff; }
  select:focus, input[type=text]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button { cursor: pointer; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; padding: 13px 18px; transition: filter 0.1s, background 0.15s; }
  button:hover { filter: brightness(1.04); }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-primary:disabled { background: #a8b9b5; cursor: not-allowed; filter: none; }
  .btn-secondary { background: var(--accent-soft); color: var(--accent-dark); width: 100%; margin-top: 8px; }
  .or-sep { text-align: center; color: var(--muted); font-size: 12px; margin: 4px 0 14px; }
  .hidden { display: none !important; }

  .room-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .room-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .room-header-right { display: flex; align-items: center; gap: 8px; }
  .room-code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 17px; background: var(--accent-soft); color: var(--accent-dark); padding: 5px 12px; border-radius: 8px; font-weight: 600; }
  .presence { font-size: 14px; color: var(--muted); }
  .copy-link, .leave-btn { background: var(--accent-soft); color: var(--accent-dark); padding: 8px 14px; font-size: 14px; }
  .leave-btn { background: #f7ece9; color: var(--danger); }

  .feed { display: flex; flex-direction: column; gap: 12px; min-height: 260px; }
  .empty-hint { color: var(--muted); font-size: 14px; text-align: center; padding: 50px 16px; }
  /* Colored by the SPEAKER's language (not by who's own bubble it is) -
     with two people going back and forth, or a room with more than two
     participants, this is what actually lets you tell speakers apart at
     a glance without reading the tiny language label every time. "Own"
     bubbles get a subtle inset ring on top of their language color
     instead of a different background, so the language color stays the
     primary, consistent cue for both sides of the conversation. */
  .bubble { border: 1px solid var(--border); border-inline-start: 4px solid var(--border); border-radius: 14px; padding: 12px 16px; background: #f4f3ee; }
  .bubble.own { box-shadow: inset 0 0 0 1px var(--accent); }
  .bubble.bubble-by-en { background: #eff6ff; border-inline-start-color: #2563eb; }
  .bubble.bubble-by-de { background: #fefce8; border-inline-start-color: #a16207; }
  .bubble.bubble-by-fr { background: #f5f3ff; border-inline-start-color: #7c3aed; }
  .bubble.bubble-by-es { background: #fff7ed; border-inline-start-color: #c2410c; }
  .bubble.bubble-by-ar { background: #f0fdfa; border-inline-start-color: #0f766e; }
  .bubble.bubble-by-ru { background: #fdf2f8; border-inline-start-color: #be185d; }
  .bubble.bubble-by-zh { background: #fef2f2; border-inline-start-color: #b91c1c; }
  .bubble.bubble-by-tr { background: #eef2ff; border-inline-start-color: #4338ca; }
  .bubble-text { font-size: 19px; line-height: 1.5; }
  .bubble-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .bubble-lang { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }
  .bubble-orig { font-size: 13px; color: var(--muted); margin-top: 5px; font-style: italic; }
  .bubble-warn { font-size: 13px; color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 6px; padding: 4px 8px; margin-top: 6px; display: inline-block; }
  .play-btn { background: none; border: 1px solid var(--border); border-radius: 20px; width: 28px; height: 28px; font-size: 13px; padding: 0; display: flex; align-items: center; justify-content: center; }

  .mic-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(16, 24, 40, 0.05); }
  .mic-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .mic-btn { flex: 1; padding: 18px; background: var(--accent); color: #fff; border-radius: 12px; font-size: 17px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .mic-btn.listening { background: var(--accent-dark); }
  .mic-btn.recording { background: var(--danger); }
  .mic-btn:disabled { background: #a8b9b5; }
  .status-line { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; max-width: 960px; margin-left: auto; margin-right: auto; }
  .error-line { font-size: 14px; color: var(--danger); margin-top: 8px; }

  /* Arabic reads right-to-left - mirror layout, but keep the room code
     (a technical token, not prose) left-to-right so it stays copy-pasteable
     in the order it was generated. */
  html[dir="rtl"] .room-code { direction: ltr; display: inline-block; }
</style>
</head>
<body>
<!-- Shown only when mounted under DHRA (see the BASE-based toggle in the
     script below) - a standalone visit to this same file (this repo's own
     now-unused deployment) has no DHRA site to link back to. -->
<div class="dhra-header" id="dhraHeader">
  <a href="/">
    <img src="/static/logo.svg" alt="" width="20" height="20">
    <span>DHRA</span>
  </a>
</div>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">🗣️</div>
    <h1 id="appTitle">Simultaneous Interpreter</h1>
  </div>
  <p class="sub" id="appSubtitle">Join the same room and each pick your own language - every sentence spoken is instantly translated for the other side.</p>

  <div class="card" id="joinCard">
    <label for="langSelect" id="langSelectLabel">My language</label>
    <select id="langSelect"></select>

    <label for="roomInput" id="roomInputLabel">Room code (if you have one)</label>
    <input type="text" id="roomInput" placeholder="e.g. a1b2c3">

    <button class="btn-primary" id="joinBtn">Join room</button>
    <div class="or-sep" id="orSep">or</div>
    <button class="btn-secondary" id="createBtn">Create new room</button>
    <div class="error-line hidden" id="joinError"></div>
  </div>

  <div id="roomView" class="hidden">
    <div class="room-header">
      <div class="room-header-left">
        <span class="room-code" id="roomCodeLabel"></span>
        <span class="presence" id="presenceLabel"></span>
      </div>
      <div class="room-header-right">
        <button class="copy-link" id="copyLinkBtn">Copy link</button>
        <button class="leave-btn" id="leaveBtn">Leave room</button>
      </div>
    </div>

    <div class="card feed" id="feed">
      <div class="empty-hint" id="emptyHint">Nothing said yet. Tap the button below to speak.</div>
    </div>
  </div>
</div>

<div class="mic-bar hidden" id="micBar">
  <div class="mic-inner">
    <button class="mic-btn" id="micBtn">Tap to speak</button>
  </div>
  <div class="status-line" id="statusLine"></div>
  <div class="error-line hidden" id="micError"></div>
</div>

// resolve under whichever prefix actually served this page, or a request
// made while mounted would hit DHRA's own root routes instead of this
// app's. location.pathname is that prefix; stripping the trailing slash
// gives "" standalone (paths stay exactly "/rooms" etc.) or "/interpreter"
// when mounted.
const BASE = location.pathname.replace(/\/$/, "");

    errMicAccess: (e) => `无法访问麦克风：${e}`,
    errPlaybackFailed: (e) => `播放失败：${e}`,
    errSendFailed: (e) => `发送失败：${e}`,
  },
  tr: {
    title: "Simültane Tercüman", subtitle: "Aynı odaya girin, her biriniz kendi dilini seçsin - konuşulan her cümle diğer tarafın diline anında çevrilir.",
    langSelectLabel: "Dilim", roomInputLabel: "Oda kodu (varsa)", roomInputPlaceholder: "örn. a1b2c3",
    joinBtn: "Odaya katıl", orSep: "veya", createBtn: "Yeni oda oluştur", copyLinkBtn: "Bağlantıyı kopyala", leaveBtn: "Odadan çık",
    emptyHint: "Henüz bir şey konuşulmadı. Konuşmak için aşağıdaki düğmeye dokunun.",
    micBtnIdle: "Dinlemeyi başlatmak için dokun", micBtnRecording: "Dinleniyor… durdurmak için dokun",
    presence: (n) => `${n} kişi odada`,
    errRoomCreateFailed: (e) => `Oda oluşturulamadı: ${e}`,
    errNeedRoomCode: "Bir oda kodu girin ya da yeni oda oluşturun.",
    errConnectionFailed: "Bağlantı kurulamadı.",
    statusDisconnected: "Bağlantı kesildi. Sayfayı yenileyip tekrar katılabilirsiniz.",
    statusReconnecting: (s) => `Bağlantı kesildi - ${s} sn içinde tekrar denenecek…`,
    statusReconnected: "Yeniden bağlanıldı.",
    statusLinkCopied: "Bağlantı kopyalandı.",
    statusTranscribing: "Çözümleniyor…",
    statusNoSpeech: "Ses algılanamadı, tekrar deneyin.",
    translationUnavailable: "⚠ Çeviri yapılamadı - orijinal metin gösteriliyor",
    errMicAccess: (e) => `Mikrofona erişilemedi: ${e}`,
    errPlaybackFailed: (e) => `Seslendirme başarısız: ${e}`,
    errSendFailed: (e) => `Gönderilemedi: ${e}`,
  },
};

let uiLang = "en";
function t() { return UI_STRINGS[uiLang] || UI_STRINGS.en; }

function applyUiLanguage(lang) {
  uiLang = UI_STRINGS[lang] ? lang : "en";
  const s = t();
  document.documentElement.lang = uiLang;
  // Arabic is the only right-to-left language in this set - everything
  // else stays ltr regardless of the visitor's own language, since none
  // of the other seven are RTL scripts.
  document.documentElement.dir = uiLang === "ar" ? "rtl" : "ltr";
  document.title = s.title;
  appTitle.textContent = s.title;
  appSubtitle.textContent = s.subtitle;
  langSelectLabel.textContent = s.langSelectLabel;
  roomInputLabel.textContent = s.roomInputLabel;
  roomInput.placeholder = s.roomInputPlaceholder;
  joinBtn.textContent = s.joinBtn;
  orSep.textContent = s.orSep;
  createBtn.textContent = s.createBtn;
  copyLinkBtn.textContent = s.copyLinkBtn;
  leaveBtn.textContent = s.leaveBtn;
  emptyHint.textContent = s.emptyHint;
  micBtn.textContent = listening ? s.micBtnRecording : s.micBtnIdle;
  if (roomId) presenceLabel.dataset.count !== undefined && (presenceLabel.textContent = s.presence(Number(presenceLabel.dataset.count)));
}

const langSelect = document.getElementById('langSelect');
for (const [code, name] of Object.entries(LANGUAGES)) {
  const opt = document.createElement('option');
  opt.value = code; opt.textContent = name;
  langSelect.appendChild(opt);
}
const browserLang = (navigator.language || 'en').slice(0, 2);
langSelect.value = LANGUAGES[browserLang] ? browserLang : 'en';
// The dropdown is both "which language do I speak" (for translation) and
// "which language is the interface in" for this participant - the two are
// the same choice for one person, so one control does both jobs. Live-
// updates the interface immediately on change; the initial call happens
// further down, once every element applyUiLanguage() touches has been
// declared (it reads listening/roomInput/etc., which don't exist yet
// at this point in the script).
langSelect.addEventListener('change', () => applyUiLanguage(langSelect.value));

const joinCard = document.getElementById('joinCard');
const roomView = document.getElementById('roomView');
const micBar = document.getElementById('micBar');
const roomInput = document.getElementById('roomInput');
const joinError = document.getElementById('joinError');
const feed = document.getElementById('feed');
const emptyHint = document.getElementById('emptyHint');
const roomCodeLabel = document.getElementById('roomCodeLabel');
const presenceLabel = document.getElementById('presenceLabel');
const statusLine = document.getElementById('statusLine');
const micError = document.getElementById('micError');
const micBtn = document.getElementById('micBtn');
const leaveBtn = document.getElementById('leaveBtn');

let ws = null;
let roomId = null;
let myLanguage = null;
let listening = false;
let reconnectAttempts = 0;
let reconnectTimer = null;
let intentionalClose = false;

applyUiLanguage(langSelect.value);

function showError(el, msg) {
  el.textContent = msg;
  el.classList.remove('hidden');
}
function clearError(el) { el.classList.add('hidden'); }

const params = new URLSearchParams(location.search);
if (params.get('room')) roomInput.value = params.get('room');

document.getElementById('createBtn').addEventListener('click', async () => {
  clearError(joinError);
  try {
    const resp = await fetch(`${BASE}/rooms`, { method: 'POST' });
    const data = await resp.json();
    roomInput.value = data.room_id;
    await enterRoom(data.room_id);
  } catch (e) {
    showError(joinError, t().errRoomCreateFailed(e));
  }
});

document.getElementById('joinBtn').addEventListener('click', async () => {
  clearError(joinError);
  const code = roomInput.value.trim();
  if (!code) { showError(joinError, t().errNeedRoomCode); return; }
  await enterRoom(code);
});

async function enterRoom(code) {
  roomId = code;
  myLanguage = langSelect.value;
  intentionalClose = false;
  reconnectAttempts = 0;
  connectWebSocket();
}

// Split out from enterRoom() so a dropped connection can call this again
// itself, with a growing delay, instead of just telling the user to
// refresh the page (the room-code URL param means a real refresh would
// have worked too, but doing it automatically is one less thing to
// notice and do mid-conversation). intentionalClose distinguishes "the
// user pressed Leave room" (stop, don't reconnect) from every other
// close (network blip, server redeploy, Render's free tier waking back
// up) which should retry.
function connectWebSocket() {
  const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${wsProto}://${location.host}${BASE}/ws/${roomId}`);

  ws.onopen = () => {
    const isReconnect = reconnectAttempts > 0;
    reconnectAttempts = 0;
    clearTimeout(reconnectTimer);
    ws.send(JSON.stringify({ type: 'join', language: myLanguage }));
    joinCard.classList.add('hidden');
    roomView.classList.remove('hidden');
    micBar.classList.remove('hidden');
    micBtn.disabled = false;
    roomCodeLabel.textContent = roomId;
    history.replaceState(null, '', `?room=${roomId}`);
    statusLine.textContent = isReconnect ? t().statusReconnected : '';
  };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'presence') {
      presenceLabel.dataset.count = msg.participant_count;
      presenceLabel.textContent = t().presence(msg.participant_count);
    } else if (msg.type === 'utterance') {
      addUtterance(msg);
    }
  };
  ws.onclose = () => {
    if (intentionalClose) return;
    micBtn.disabled = true;
    reconnectAttempts += 1;
    // Exponential backoff (1s, 2s, 4s, ... capped at 15s) - a moment
    // after this app's own server redeploys/restarts, or wakes up from
    // Render's free-tier idle sleep, is exactly when a burst of
    // reconnect attempts from everyone would be least helpful.
    const delaySeconds = Math.min(2 ** (reconnectAttempts - 1), 15);
    statusLine.textContent = t().statusReconnecting(delaySeconds);
    reconnectTimer = setTimeout(connectWebSocket, delaySeconds * 1000);
  };
  // onclose always fires after onerror for a WebSocket, and already
  // carries the reconnect logic above - no separate handling needed here.
  ws.onerror = () => {};
}

function leaveRoom() {
  if (listening) stopListening();
  intentionalClose = true;
  clearTimeout(reconnectTimer);
  reconnectAttempts = 0;
  if (ws) { ws.close(); ws = null; }
  roomId = null;
  roomView.classList.add('hidden');
  micBar.classList.add('hidden');
  joinCard.classList.remove('hidden');
  feed.querySelectorAll('.bubble').forEach((el) => el.remove());
  emptyHint.classList.remove('hidden');
  statusLine.textContent = '';
  clearError(micError);
  clearError(joinError);
  history.replaceState(null, '', location.pathname);
}

leaveBtn.addEventListener('click', leaveRoom);

document.getElementById('copyLinkBtn').addEventListener('click', async () => {
  const link = `${location.origin}${location.pathname}?room=${roomId}`;
  try {
    await navigator.clipboard.writeText(link);
    statusLine.textContent = t().statusLinkCopied;
  } catch {
    statusLine.textContent = link;
  }
});

function addUtterance(msg) {
  emptyHint.classList.add('hidden');
  const isOwn = msg.speaker_language === myLanguage;
  const failed = !isOwn && msg.translation_failed && msg.translation_failed[myLanguage];
  const displayText = isOwn ? msg.original_text : (msg.translations[myLanguage] ?? msg.original_text);

  const bubble = document.createElement('div');
  bubble.className = 'bubble bubble-by-' + msg.speaker_language + (isOwn ? ' own' : '');

  const textEl = document.createElement('div');
  textEl.className = 'bubble-text';
  textEl.textContent = displayText;
  bubble.appendChild(textEl);

  if (failed) {
    // Translation genuinely failed server-side (API error/quota/etc.) and
    // degraded to the original text - showing the usual "original
    // language: <same text>" reference line here would just repeat the
    // main line verbatim, which reads as a confusing duplicate rather
    // than a translation. A clear warning instead says what actually
    // happened.
    const warn = document.createElement('div');
    warn.className = 'bubble-warn';
    warn.textContent = t().translationUnavailable;
    bubble.appendChild(warn);
  } else if (!isOwn) {
    const orig = document.createElement('div');
    orig.className = 'bubble-orig';
    orig.textContent = `${LANGUAGES[msg.speaker_language] || msg.speaker_language}: ${msg.original_text}`;
    bubble.appendChild(orig);
  }

  const meta = document.createElement('div');
  meta.className = 'bubble-meta';
  const langLabel = document.createElement('span');
  langLabel.className = 'bubble-lang';
  langLabel.textContent = isOwn ? (LANGUAGES[myLanguage] || myLanguage) : (LANGUAGES[myLanguage] || myLanguage);
  meta.appendChild(langLabel);

  const playBtn = document.createElement('button');
  playBtn.className = 'play-btn';
  playBtn.textContent = '🔊';
  playBtn.addEventListener('click', () => playTts(displayText, playBtn));
  meta.appendChild(playBtn);

  bubble.appendChild(meta);
  feed.appendChild(bubble);
  feed.scrollTop = feed.scrollHeight;
}

async function playTts(text, btn) {
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = '…';
  try {
    const form = new URLSearchParams({ text, language: myLanguage });
    const resp = await fetch(`${BASE}/tts`, { method: 'POST', body: form });
    if (!resp.ok) throw new Error(await resp.text());
    const blob = await resp.blob();
    const audio = new Audio(URL.createObjectURL(blob));
    await audio.play();
  } catch (e) {
    showError(micError, t().errPlaybackFailed(e));
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

// Safari (14.1 through 18.3) has no WebM support at all -
// MediaRecorder.isTypeSupported('audio/webm') is false, and constructing
// a MediaRecorder with an unsupported mimeType throws synchronously, so
// hardcoding 'audio/webm' hard-fails the mic button on those versions
// (Safari 18.4+ added WebM, but still defaults to audio/mp4). Probe for
// what THIS browser actually supports instead of assuming webm - no
// library needed, MediaRecorder.isTypeSupported is a native browser API.
const MIME_CANDIDATES = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/mp4;codecs=mp4a.40.2'];
// speech.py picks the temp-file suffix from this filename extension and
// hands it to faster-whisper (PyAV-decoded, no system ffmpeg) - PyAV reads
// MP4/AAC containers natively, so no backend change is needed, only
// telling it the real container instead of always claiming .webm.
const EXT_FOR_MIME = { 'audio/webm': 'webm', 'audio/mp4': 'mp4' };

let recordingMimeType = '';

// --- Continuous listening with auto voice-activity detection ---
// Replaces manual push-to-talk: instead of the speaker pressing a button
// before and after every sentence, the mic stays open for the whole
// conversation and a lightweight energy-based VAD decides on its own when
// one utterance ends and the next begins (on a pause in speech). Each
// auto-cut segment goes to the same /speak endpoint as before - this is
// what keeps translation latency at "per sentence" regardless of how long
// the overall conversation runs, instead of "wait for the whole paragraph"
// the old press-and-release-once-per-paragraph interaction encouraged.
const VAD_SILENCE_MS = 700;        // pause length that ends an utterance
const VAD_MAX_SEGMENT_MS = 15000;  // force-cut a very long unbroken sentence
const VAD_ABS_MIN_RMS = 0.02;      // floor so a near-silent room can't self-trigger
const VAD_VOICE_MULTIPLIER = 2.2;  // how far above the noise floor counts as speech

let micStream = null;
let audioCtx = null;
let analyser = null;
let vadBuf = null;
let vadRafId = null;
let segmentRecorder = null;
let segmentChunks = [];
let segmentStartTs = 0;
let speechStartTs = 0;
let silenceStartTs = null;
let voiceActive = false;
let speechDetectedInSegment = false;
let noiseFloor = 0.01;

function beginSegment() {
  segmentChunks = [];
  speechDetectedInSegment = false;
  segmentStartTs = performance.now();
  const supported = MIME_CANDIDATES.find((m) => MediaRecorder.isTypeSupported(m));
  segmentRecorder = new MediaRecorder(micStream, supported ? { mimeType: supported } : undefined);
  // Read back .mimeType rather than trust `supported` directly - the
  // browser may report a slightly different/normalized string, and if
  // none of our candidates were supported at all, `supported` is
  // undefined but the browser still picked its own default, which
  // .mimeType reveals after construction.
  recordingMimeType = segmentRecorder.mimeType || supported || 'audio/webm';
  segmentRecorder.ondataavailable = (e) => { if (e.data.size > 0) segmentChunks.push(e.data); };
  segmentRecorder.onstop = () => {
    if (segmentChunks.length && speechDetectedInSegment) {
      const blob = new Blob(segmentChunks, { type: recordingMimeType });
      sendUtterance(blob);
    }
    if (listening) beginSegment(); // next utterance starts immediately, no gap
  };
  segmentRecorder.start();
}

function endCurrentSegmentAndRestart() {
  if (segmentRecorder && segmentRecorder.state !== 'inactive') {
    segmentRecorder.stop(); // onstop above sends it (if it had speech) and starts the next one
  }
}

function computeRms() {
  analyser.getFloatTimeDomainData(vadBuf);
  let sum = 0;
  for (let i = 0; i < vadBuf.length; i++) sum += vadBuf[i] * vadBuf[i];
  return Math.sqrt(sum / vadBuf.length);
}

function vadTick() {
  if (!listening) return;
  const rms = computeRms();
  const now = performance.now();
  const voiceThreshold = Math.max(VAD_ABS_MIN_RMS, noiseFloor * VAD_VOICE_MULTIPLIER);
  const isVoice = rms > voiceThreshold;

  if (isVoice) {
    if (!voiceActive) {
      voiceActive = true;
      speechStartTs = now;
      speechDetectedInSegment = true;
      micBtn.classList.add('recording');
    }
    silenceStartTs = null;
  } else {
    // Only drift the noise floor during quiet stretches, not mid-sentence -
    // otherwise a long utterance would slowly raise the floor to match the
    // speaker's own voice and silence would stop being detected at all.
    if (!voiceActive) noiseFloor = noiseFloor * 0.95 + rms * 0.05;
    if (voiceActive) {
      if (silenceStartTs === null) {
        silenceStartTs = now;
      } else if (now - silenceStartTs >= VAD_SILENCE_MS) {
        voiceActive = false;
        micBtn.classList.remove('recording');
        endCurrentSegmentAndRestart();
      }
    }
  }

  // Only force-cut a segment that's actually mid-speech and has run long -
  // during silence there's nothing to cut short, so leave it be rather
  // than needlessly recreating the MediaRecorder every 15s while idle.
  if (speechDetectedInSegment && now - segmentStartTs >= VAD_MAX_SEGMENT_MS) endCurrentSegmentAndRestart();
  vadRafId = requestAnimationFrame(vadTick);
}

async function startListening() {
  clearError(micError);
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    showError(micError, t().errMicAccess(e.message));
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  vadBuf = new Float32Array(analyser.fftSize);
  source.connect(analyser);

  listening = true;
  voiceActive = false;
  silenceStartTs = null;
  noiseFloor = 0.01;
  micBtn.classList.add('listening');
  micBtn.textContent = t().micBtnRecording;
  beginSegment();
  vadRafId = requestAnimationFrame(vadTick);
}

function stopListening() {
  listening = false;
  if (vadRafId) cancelAnimationFrame(vadRafId);
  vadRafId = null;
  if (segmentRecorder && segmentRecorder.state !== 'inactive') {
    segmentRecorder.onstop = null; // don't send a fragment cut off mid-word, and don't auto-restart
    segmentRecorder.stop();
  }
  if (micStream) micStream.getTracks().forEach((tr) => tr.stop());
  if (audioCtx) audioCtx.close();
  micStream = null; audioCtx = null; analyser = null;
  micBtn.classList.remove('recording', 'listening');
  micBtn.textContent = t().micBtnIdle;
}

async function sendUtterance(blob) {
  statusLine.textContent = t().statusTranscribing;
  try {
    const container = Object.keys(EXT_FOR_MIME).find((k) => recordingMimeType.startsWith(k));
    const ext = EXT_FOR_MIME[container] || 'webm';
    const form = new FormData();
    form.append('audio', blob, `utterance.${ext}`);
    form.append('language', myLanguage);
    const resp = await fetch(`${BASE}/rooms/${roomId}/speak`, { method: 'POST', body: form });
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    statusLine.textContent = data.skipped ? t().statusNoSpeech : '';
  } catch (e) {
    showError(micError, t().errSendFailed(e.message));
    statusLine.textContent = '';
  }
}

// One tap starts a whole listening session, one tap stops it - the VAD
// above handles cutting individual utterances automatically in between.
micBtn.addEventListener('click', () => {
  if (listening) stopListening(); else startListening();
});
</script>
</body>
</html>
