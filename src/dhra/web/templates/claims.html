{% extends "base.html" %}
{% block title %}Claims -- DHRA{% endblock %}
{% block content %}
<h1>Claims</h1>
<p><a href="/claims/new">+ assess a new claim</a></p>
<table>
  <tr><th>status</th><th>claim</th></tr>
  {% for c in claims %}
  <tr>
    <td><span class="status-code" data-tone="{{ status_tone(c.status) }}" title="{{ status_meaning(c.status) }}">{{ c.status.value }}</span></td>
    <td><a href="/claims/{{ c.claim_id }}">{{ c.claim_text }}</a></td>
  </tr>
  {% else %}
  <tr><td colspan="2" class="muted">No claims assessed yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
