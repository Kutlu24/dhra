<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DHRA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6b66"/>
      <stop offset="1" stop-color="#0f3d3a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- manuscript leaf -->
  <path d="M17 18 Q17 13 22 13 H60 Q65 13 65 18 V80 Q65 85 60 85 H22 Q17 85 17 80 Z" fill="#fbf3e0"/>
  <path d="M17 18 Q17 13 22 13 H26 V85 H22 Q17 85 17 80 Z" fill="#e8d8b4"/>
  <!-- illuminated initial -->
  <rect x="31" y="21" width="9" height="9" rx="2" fill="#c9a227"/>
  <!-- lines of script -->
  <g fill="none" stroke="#1f6b66" stroke-width="2.2" stroke-linecap="round">
    <path d="M44 26 q3 -4 6 0 t6 0"/>
    <path d="M30 38 q4 -5 8 0 t8 0 t8 0 t5 0"/>
    <path d="M30 49 q4 -5 8 0 t8 0 t8 0"/>
    <path d="M30 60 q4 -5 8 0 t8 0 t6 0"/>
  </g>
  <!-- fresh ink under the nib -->
  <path d="M30 71 q4 -5 8 0 t6 0" fill="none" stroke="#c9a227" stroke-width="2.4" stroke-linecap="round"/>
  <!-- reed pen (kalem) -->
  <path d="M47 71 L80 38" stroke="#5a3a0c" stroke-width="5" stroke-linecap="round"/>
  <path d="M47 71 L80 38" stroke="#b07a22" stroke-width="2" stroke-linecap="round"/>
  <path d="M43.5 74.5 L49 69 L51 72 Z" fill="#1c1b17"/>
  <!-- hand holding the pen -->
  <path d="M60 60 C56 58 55 53 59 52 L66 49 C70 47 73 49 73 52 C79 52 86 56 90 63 L94 88 Q95 93 90 93 H70 Q64 93 64 86 L62 72 Z" fill="#f0c9a0" stroke="#7a4a22" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- thumb and index finger pinching the reed -->
  <path d="M63 57 Q67 52 73 53" fill="none" stroke="#7a4a22" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M70 54 Q76 56 78 62" fill="none" stroke="#7a4a22" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M74 50 Q81 49 82 55" fill="none" stroke="#7a4a22" stroke-width="1.6" stroke-linecap="round"/>
  <!-- cuff -->
  <path d="M66 88 H93" stroke="#c9a227" stroke-width="4" stroke-linecap="round"/>
</svg>
