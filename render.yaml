services:
  - type: web
    name: dhra
    runtime: docker
    plan: free
    envVars:
      # Back to a real demo banner (2026-09-18, reversing the earlier
      # "permanent product" framing): this deployment's store still resets
      # on restart and there's still no auth, so it stays labeled as a demo
      # -- with a link to a real, persistent, private copy instead. sync:
      # false because the Render dashboard is where this is actually
      # edited; the value below only applies on a fresh blueprint sync.
      - key: DHRA_DEMO_BANNER
        sync: false
        # value to paste into the Render dashboard if it's ever unset:
        # Demo deployment -- data resets on restart and isn't private (no login). Want your own private, persistent copy? <a href="https://github.com/Kutlu24/dhra/releases">Download it here</a> or <a href="https://github.com/Kutlu24/dhra">see the source</a>.
      # GLM (Z.AI free-tier API key, obtained directly by the researcher --
      # not self-hosted) -- not required for the demo to run: chat/research/
      # teaching all degrade gracefully to evidence-only without them. Set
      # these once the key exists.
      - key: DHRA_GLM_BASE_URL
        sync: false
      - key: DHRA_GLM_API_KEY
        sync: false
      - key: DHRA_GLM_MODEL
        sync: false
