name: Build desktop executables

# PyInstaller doesn't cross-compile -- each OS has to build its own
# binary, which is the actual reason this needs CI at all rather than
# being buildable from one machine. See src/dhra/desktop.py and
# desktop.spec for what these binaries do and don't solve (no bundled
# poppler/tesseract, no code signing -- Windows/macOS will show an
# "unknown publisher" warning on first run until someone buys a
# certificate).

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: dhra-desktop
            asset_name: dhra-desktop-linux
          - os: windows-latest
            artifact_name: dhra-desktop.exe
            asset_name: dhra-desktop-windows.exe
          - os: macos-latest
            artifact_name: dhra-desktop
            asset_name: dhra-desktop-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DHRA and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop-build]"

      - name: Build with PyInstaller
        run: pyinstaller desktop.spec

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.artifact_name }}" "out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}
